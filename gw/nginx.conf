server {
  listen 8000;
  client_max_body_size 50m;

  # Supabase (lo usa el panel)
  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, x-supabase-api-version, prefer" always;
      return 204;
    }
    proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /rest/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, accept-profile, content-profile, prefer, range" always;
      return 204;
    }
    proxy_pass http://rest:3000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
  }

  # Proxy de IA, administración y panel. Sin buffer para que el streaming llegue al instante.
  location / {
    proxy_pass http://proxy:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
}
