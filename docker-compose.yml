name: llm-gateway
# Supabase reducido (Postgres + Auth + PostgREST) + proxy propio + nginx de entrada.
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./db/init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./db/init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    mem_limit: 1g

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}/panel/
      GOTRUE_DISABLE_SIGNUP: "true"          # usuarios solo por la API de administración
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 10
    mem_limit: 256m

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_MAX_ROWS: 5000
    mem_limit: 256m

  proxy:
    image: node:22-alpine
    restart: unless-stopped
    depends_on: [rest, auth]
    working_dir: /app
    command: ["node", "proxy/server.mjs"]
    volumes:
      - ./proxy:/app/proxy:ro
      - ./panel:/app/panel:ro
    environment:
      PORT: 8080
      REST_URL: http://rest:3000
      AUTH_URL: http://auth:9999
      PUBLIC_URL: ${PUBLIC_URL}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      GATEWAY_ENC_KEY: ${GATEWAY_ENC_KEY}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REPORTE_PARA: ${REPORTE_PARA:-}
      REPORTE_HORA: ${REPORTE_HORA:-8}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      SUSCRIPCION_HABILITADA: ${SUSCRIPCION_HABILITADA:-false}
      GW_RESPALDO_FILTRO: ${GW_RESPALDO_FILTRO:-gpt-5.4}   # modelo de reintento si OpenAI rechaza por su filtro; vacío = apagado
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 512m

  gw:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [auth, rest, proxy]
    ports:
      - "${BIND_IP:-127.0.0.1}:8740:8000"     # 127.0.0.1 = solo local; pon la IP de tu red privada para exponerlo ahí
    volumes: ["./gw/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    mem_limit: 64m

volumes:
  db-config:
